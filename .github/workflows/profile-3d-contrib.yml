name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    name: Generate 3D Contribution Graph

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Duplicate GitBlock for themes
        run: |
          cp profile-3d-contrib/profile-gitblock.svg profile-3d-contrib/profile-gitblock-dark.svg
          cp profile-3d-contrib/profile-gitblock.svg profile-3d-contrib/profile-gitblock-light.svg

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "generated 3d contribution graph"
            git push
          fi
