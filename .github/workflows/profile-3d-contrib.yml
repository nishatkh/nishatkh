name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # Checkout repository
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ==========================================================
      # Create custom settings
      #
      # IMPORTANT:
      # - Canvas background = transparent
      # - Empty LEGO cells = white
      # - Contribution levels = colorful
      # ==========================================================
      - name: Create 3D settings
        shell: bash
        run: |
          mkdir -p .github/3d-settings

          cat > .github/3d-settings/full.json <<'EOF'
          {
            "type": "gitblock",
            "fileName": "profile-full.svg",

            "backgroundColor": "transparent",
            "foregroundColor": "#24292f",
            "strongColor": "#1f2328",
            "weakColor": "#57606a",
            "radarColor": "#0969da",

            "contribColors": [
              "#ffffff",
              "#39d353",
              "#0969da",
              "#f2cc60",
              "#ff7b72"
            ],

            "darkMode": {
              "type": "gitblock",
              "backgroundColor": "transparent",
              "foregroundColor": "#ffffff",
              "strongColor": "#ffffff",
              "weakColor": "#8b949e",
              "radarColor": "#58a6ff",

              "contribColors": [
                "#ffffff",
                "#39d353",
                "#58a6ff",
                "#f2cc60",
                "#ff7b72"
              ]
            }
          }
          EOF

      # ==========================================================
      # Generate the 3D graph
      # ==========================================================
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-settings/full.json

      # ==========================================================
      # Fix generated SVG
      #
      # DO NOT remove the LEGO floor.
      # Only remove the large canvas background.
      # ==========================================================
      - name: Fix transparent background and colors
        shell: bash
        run: |
          FILE="profile-3d-contrib/profile-full.svg"

          python3 <<'PY'
          from pathlib import Path
          import re

          file = Path("profile-3d-contrib/profile-full.svg")
          svg = file.read_text()

          # ------------------------------------------------------
          # Remove common full-canvas background rectangles.
          # Keep the LEGO contribution cells.
          # ------------------------------------------------------

          patterns = [
              r'<rect[^>]*width="1280"[^>]*height="850"[^>]*/>',
              r'<rect[^>]*width="1280"[^>]*height="850"[^>]*>.*?</rect>',
              r'<rect[^>]*x="0"[^>]*y="0"[^>]*width="1280"[^>]*height="850"[^>]*/>',
              r'<rect[^>]*x="0"[^>]*y="0"[^>]*width="1280"[^>]*height="850"[^>]*>.*?</rect>'
          ]

          for pattern in patterns:
              svg = re.sub(
                  pattern,
                  '',
                  svg,
                  flags=re.DOTALL | re.IGNORECASE
              )

          # ------------------------------------------------------
          # Make generic background styles transparent.
          # ------------------------------------------------------

          svg = svg.replace(
              ".fill-bg { fill: #000000; }",
              ".fill-bg { fill: transparent; }"
          )

          svg = svg.replace(
              ".fill-bg { fill:#000000; }",
              ".fill-bg { fill: transparent; }"
          )

          svg = svg.replace(
              ".fill-bg{fill:#000000}",
              ".fill-bg{fill:transparent}"
          )

          svg = svg.replace(
              'fill="#000000"',
              'fill="transparent"'
          )

          # ------------------------------------------------------
          # Make the EMPTY contribution cells WHITE.
          #
          # These are the LEGO floor cells, not the page background.
          # ------------------------------------------------------

          for side in ["top", "left", "right"]:
              svg = svg.replace(
                  f".cont-{side}-bg-0 {{ fill: #161b22; }}",
                  f".cont-{side}-bg-0 {{ fill: #ffffff; }}"
              )

              svg = svg.replace(
                  f".cont-{side}-bg-0 {{fill:#161b22;}}",
                  f".cont-{side}-bg-0 {{fill:#ffffff;}}"
              )

              svg = svg.replace(
                  f".cont-{side}-bg-0{{fill:#161b22}}",
                  f".cont-{side}-bg-0{{fill:#ffffff}}"
              )

          # ------------------------------------------------------
          # Keep the four contribution levels colorful.
          # ------------------------------------------------------

          colors = {
              "#39d353": "#39d353",
              "#58a6ff": "#58a6ff",
              "#f2cc60": "#f2cc60",
              "#ff7b72": "#ff7b72"
          }

          for old, new in colors.items():
              svg = svg.replace(old, new)

          # ------------------------------------------------------
          # Make dark-mode text visible.
          # ------------------------------------------------------

          svg = svg.replace(
              ".fill-fg { fill: #24292f; }",
              ".fill-fg { fill: #ffffff; }"
          )

          svg = svg.replace(
              ".stroke-fg { stroke: #24292f; }",
              ".stroke-fg { stroke: #ffffff; }"
          )

          # ------------------------------------------------------
          # Make radar and labels visible.
          # ------------------------------------------------------

          svg = svg.replace(
              ".radar {",
              ".radar {"
          )

          file.write_text(svg)
          PY

      # ==========================================================
      # Save the final graph
      # ==========================================================
      - name: Save final graph
        shell: bash
        run: |
          cp \
            profile-3d-contrib/profile-full.svg \
            profile-3d-contrib/profile-full-current.svg

      # ==========================================================
      # Check that the SVG exists
      # ==========================================================
      - name: Verify generated graph
        shell: bash
        run: |
          test -f profile-3d-contrib/profile-full-current.svg

          echo "3D graph generated successfully."
          echo "File size:"
          du -h profile-3d-contrib/profile-full-current.svg

      # ==========================================================
      # Commit and push
      # ==========================================================
      - name: Commit generated graph
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add profile-3d-contrib/profile-full.svg
          git add profile-3d-contrib/profile-full-current.svg

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update 3D contribution graph"
            git push
          fi
