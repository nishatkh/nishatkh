- name: Configure transparent background with white LEGO structure
  shell: python
  run: |
    import json

    path = ".github/3d-settings/full.json"

    with open(path, "r", encoding="utf-8") as f:
        data = json.load(f)

    # Transparent outside background
    data["backgroundColor"] = "transparent"

    # White text
    data["foregroundColor"] = "#ffffff"
    data["strongColor"] = "#ffffff"
    data["weakColor"] = "#ffffff"

    # White radar
    data["radarColor"] = "#ffffff"

    # White LEGO structure + colorful commits
    colors = [
        ("#ffffff", "#ffffff"),
        ("#0e4429", "#39d353"),
        ("#0969da", "#79c0ff"),
        ("#9e6a03", "#f2cc60"),
        ("#da3633", "#ff7b72")
    ]

    for pattern, (background, foreground) in zip(
        data["contribPatterns"],
        colors
    ):
        # Top
        pattern["top"]["backgroundColor"] = background
        pattern["top"]["foregroundColor"] = foreground

        # Left LEGO face
        pattern["left"]["backgroundColor"] = "#ffffff"
        pattern["left"]["foregroundColor"] = foreground

        # Right LEGO face
        pattern["right"]["backgroundColor"] = "#ffffff"
        pattern["right"]["foregroundColor"] = foreground

    with open(path, "w", encoding="utf-8") as f:
        json.dump(data, f, indent=2)
