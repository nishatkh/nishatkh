name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # Checkout repository
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================================
      # Make sure settings directory exists
      # ==========================================================

      - name: Prepare settings directory
        run: |
          mkdir -p .github/3d-settings
          mkdir -p profile-3d-contrib

      # ==========================================================
      # Generate FULL 3D contribution graph
      #
      # - Transparent SVG background
      # - White LEGO contribution cells
      # - GitHub green contribution colors
      # - Colored commits
      # - GitHub-style blue radar
      # ==========================================================

      - name: Generate full 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-settings/full.json

      # ==========================================================
      # Rename generated graph
      # ==========================================================

      - name: Save full graph
        run: |
          if [ -f "profile-3d-contrib/profile-full.svg" ]; then
            cp profile-3d-contrib/profile-full.svg \
               profile-3d-contrib/profile-full-current.svg
          else
            echo "ERROR: profile-full.svg was not generated."
            exit 1
          fi

      # ==========================================================
      # Verify generated SVG
      # ==========================================================

      - name: Verify graph
        run: |
          echo "Generated files:"
          ls -lah profile-3d-contrib/

          echo ""
          echo "Checking SVG:"
          test -s profile-3d-contrib/profile-full-current.svg

          echo "3D contribution graph generated successfully."

      # ==========================================================
      # Commit and push
      # ==========================================================

      - name: Commit generated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/profile-full-current.svg
          git add .github/3d-settings/full.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update 3D contribution graph"
            git push
          fi
