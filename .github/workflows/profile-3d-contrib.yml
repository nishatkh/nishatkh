name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ==========================================================
      # Create custom colorful yearly calendar settings
      # ==========================================================

      - name: Create yearly calendar settings
        shell: bash
        run: |
          mkdir -p .github/3d-settings

          cat > .github/3d-settings/yearly.json <<'EOF'
          {
            "type": "normal",
            "fileName": "profile-yearly.svg",

            "backgroundColor": "#ffffff",
            "foregroundColor": "#24292f",
            "strongColor": "#1f2328",
            "weakColor": "#57606a",
            "radarColor": "#0969da",

            "contribColors": [
              "#ebedf0",
              "#9be9a8",
              "#40c463",
              "#30a14e",
              "#216e39"
            ],

            "darkMode": {
              "type": "normal",
              "backgroundColor": "#0d1117",
              "foregroundColor": "#e6edf3",
              "strongColor": "#f0f6fc",
              "weakColor": "#8b949e",
              "radarColor": "#58a6ff",

              "contribColors": [
                "#161b22",
                "#0e4429",
                "#006d32",
                "#26a641",
                "#39d353"
              ]
            }
          }
          EOF

      # ==========================================================
      # Create colorful FULL gitblock settings
      # ==========================================================

      - name: Create full gitblock settings
        shell: bash
        run: |
          cat > .github/3d-settings/full.json <<'EOF'
          {
            "type": "gitblock",
            "fileName": "profile-full.svg",

            "backgroundColor": "#ffffff",
            "foregroundColor": "#24292f",
            "strongColor": "#1f2328",
            "weakColor": "#57606a",
            "radarColor": "#0969da",

            "contribColors": [
              "#ebedf0",
              "#9be9a8",
              "#40c463",
              "#30a14e",
              "#216e39"
            ],

            "darkMode": {
              "type": "gitblock",
              "backgroundColor": "#0d1117",
              "foregroundColor": "#e6edf3",
              "strongColor": "#f0f6fc",
              "weakColor": "#8b949e",
              "radarColor": "#58a6ff",

              "contribColors": [
                "#161b22",
                "#0e4429",
                "#006d32",
                "#26a641",
                "#39d353"
              ]
            }
          }
          EOF

      # ==========================================================
      # Generate 2024 ONLY calendar
      # ==========================================================

      - name: Generate 2024
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: 2024
          SETTING_JSON: .github/3d-settings/yearly.json

      - name: Save 2024
        run: |
          cp profile-3d-contrib/profile-yearly.svg \
             profile-3d-contrib/profile-yearly-2024.svg

      # ==========================================================
      # Generate 2025 ONLY calendar
      # ==========================================================

      - name: Generate 2025
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: 2025
          SETTING_JSON: .github/3d-settings/yearly.json

      - name: Save 2025
        run: |
          cp profile-3d-contrib/profile-yearly.svg \
             profile-3d-contrib/profile-yearly-2025.svg

      # ==========================================================
      # Generate CURRENT FULL gitblock
      # ==========================================================

      - name: Generate current full graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-settings/full.json

      - name: Save current full graph
        run: |
          cp profile-3d-contrib/profile-full.svg \
             profile-3d-contrib/profile-full-current.svg

      # ==========================================================
      # Commit
      # ==========================================================

      - name: Commit generated graphs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A .

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update 3D contribution graphs"
            git push
          fi
