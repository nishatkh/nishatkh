name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ----------------------------------------------------------
      # Generate the normal colorful GitBlock graph
      # ----------------------------------------------------------
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # ----------------------------------------------------------
      # Remove ONLY the outer SVG background
      #
      # Do NOT replace all black fills.
      # The LEGO blocks and text use their own SVG fills.
      # ----------------------------------------------------------
      - name: Make only the outer background transparent
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path(
              "profile-3d-contrib/profile-gitblock.svg"
          )

          svg = path.read_text()

          # Remove a full-size background rectangle if present.
          #
          # This targets the SVG canvas only.
          # It does NOT touch LEGO cells, commits,
          # language labels or charts.

          svg = re.sub(
              r'<rect[^>]+width="100%"[^>]+height="100%"[^>]*/>',
              '',
              svg,
              flags=re.IGNORECASE
          )

          svg = re.sub(
              r'<rect[^>]+width="1280"[^>]+height="850"[^>]*/>',
              '',
              svg,
              flags=re.IGNORECASE
          )

          # Remove common root background style only.
          svg = svg.replace(
              'style="background:#000000"',
              ''
          )

          svg = svg.replace(
              'style="background: #000000"',
              ''
          )

          path.write_text(svg)

      # ----------------------------------------------------------
      # Keep a clean copy for README
      # ----------------------------------------------------------
      - name: Copy final graph
        run: |
          cp \
            profile-3d-contrib/profile-gitblock.svg \
            profile-3d-contrib/profile-gitblock-current.svg

      # ----------------------------------------------------------
      # Verify
      # ----------------------------------------------------------
      - name: Verify generated files
        run: |
          test -f profile-3d-contrib/profile-gitblock.svg
          test -f profile-3d-contrib/profile-gitblock-current.svg

          echo "3D contribution graph generated successfully."

      # ----------------------------------------------------------
      # Commit
      # ----------------------------------------------------------
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update 3D contribution graph"
            git push
          fi
