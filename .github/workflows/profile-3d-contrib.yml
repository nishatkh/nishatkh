name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================================
      # Create yearly calendar settings
      # ==========================================================

      - name: Create yearly calendar settings
        shell: bash
        run: |
          mkdir -p .github/3d-settings

          cat > .github/3d-settings/yearly.json <<'EOF'
          {
            "type": "normal",
            "fileName": "profile-yearly.svg",

            "backgroundColor": "transparent",
            "foregroundColor": "#24292f",
            "strongColor": "#1f2328",
            "weakColor": "#57606a",

            "contribColors": [
              "#ebedf0",
              "#9be9a8",
              "#40c463",
              "#30a14e",
              "#216e39"
            ],

            "darkMode": {
              "type": "normal",
              "backgroundColor": "transparent",
              "foregroundColor": "#e6edf3",
              "strongColor": "#f0f6fc",
              "weakColor": "#8b949e",

              "contribColors": [
                "#161b22",
                "#0e4429",
                "#006d32",
                "#26a641",
                "#39d353"
              ]
            }
          }
          EOF


      # ==========================================================
      # Create FULL GitBlock settings
      # ==========================================================

      - name: Create full GitBlock settings
        shell: bash
        run: |
          cat > .github/3d-settings/full.json <<'EOF'
          {
            "type": "gitblock",
            "fileName": "profile-full.svg",

            "backgroundColor": "transparent",
            "foregroundColor": "#24292f",
            "strongColor": "#1f2328",
            "weakColor": "#57606a",

            "contribColors": [
              "#ebedf0",
              "#9be9a8",
              "#40c463",
              "#30a14e",
              "#216e39"
            ],

            "darkMode": {
              "type": "gitblock",
              "backgroundColor": "transparent",
              "foregroundColor": "#e6edf3",
              "strongColor": "#f0f6fc",
              "weakColor": "#8b949e",

              "contribColors": [
                "#161b22",
                "#0e4429",
                "#006d32",
                "#26a641",
                "#39d353"
              ]
            }
          }
          EOF


      # ==========================================================
      # Generate 2024
      # ==========================================================

      - name: Generate 2024
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: 2024
          SETTING_JSON: .github/3d-settings/yearly.json

      - name: Save 2024
        shell: bash
        run: |
          test -f profile-3d-contrib/profile-yearly.svg

          cp profile-3d-contrib/profile-yearly.svg \
             profile-3d-contrib/profile-yearly-2024.svg


      # ==========================================================
      # Generate 2025
      # ==========================================================

      - name: Generate 2025
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: 2025
          SETTING_JSON: .github/3d-settings/yearly.json

      - name: Save 2025
        shell: bash
        run: |
          test -f profile-3d-contrib/profile-yearly.svg

          cp profile-3d-contrib/profile-yearly.svg \
             profile-3d-contrib/profile-yearly-2025.svg


      # ==========================================================
      # Generate CURRENT FULL GitBlock
      # ==========================================================

      - name: Generate current full GitBlock
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-settings/full.json

      - name: Save current full GitBlock
        shell: bash
        run: |
          test -f profile-3d-contrib/profile-full.svg

          cp profile-3d-contrib/profile-full.svg \
             profile-3d-contrib/profile-full-current.svg


      # ==========================================================
      # Remove generated SVG background safely
      # ==========================================================

      - name: Remove SVG background
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              "profile-3d-contrib/profile-full-current.svg",
              "profile-3d-contrib/profile-yearly-2024.svg",
              "profile-3d-contrib/profile-yearly-2025.svg"
          ]

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  print(f"Skipping missing file: {filename}")
                  continue

              text = path.read_text(encoding="utf-8")

              # Remove common full-canvas background rectangles.
              text = re.sub(
                  r'<rect[^>]*(?:width=["\']100%["\'][^>]*height=["\']100%["\'][^>]*)[^>]*/>',
                  '',
                  text,
                  flags=re.IGNORECASE
              )

              text = re.sub(
                  r'<rect[^>]*x=["\']0["\'][^>]*y=["\']0["\'][^>]*/>',
                  '',
                  text,
                  flags=re.IGNORECASE
              )

              path.write_text(text, encoding="utf-8")

              print(f"Processed: {filename}")
          PY


      # ==========================================================
      # Verify generated files
      # ==========================================================

      - name: Verify generated graphs
        shell: bash
        run: |
          echo "Generated files:"
          ls -lh profile-3d-contrib/

          test -s profile-3d-contrib/profile-yearly-2024.svg
          test -s profile-3d-contrib/profile-yearly-2025.svg
          test -s profile-3d-contrib/profile-full-current.svg


      # ==========================================================
      # Commit
      # ==========================================================

      - name: Commit generated graphs
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update 3D contribution graphs"
            git push
          fi
